# .github/workflows/git-cicd-open.yml - GENERATED by git-cicd; do not edit by hand.
#
# The workflow for the `open` trigger (a pull request is opened or updated),
# named `Open`, so GitHub shows every row as `Open / <row>`. git-cicd
# generates one workflow per trigger, each its own file with its own GitHub event,
# permissions and overlap rule:
#
#   open    Open    .github/workflows/git-cicd-open.yml    (generated)
#   merge   Merge   .github/workflows/git-cicd-merge.yml   (not built yet)
#   cron    Cron    .github/workflows/git-cicd-cron.yml    (not built yet)
#   manual  Manual  .github/workflows/git-cicd-manual.yml  (not built yet)
#
# Every generated file is fixed text except the cron workflow's schedule
# block; this file does not vary with the config at all, only with the
# git-cicd version (and the tool path, which is where git-cicd is installed).
# Whoever upgrades git-cicd, or changes the config, runs
#   __TOOL__ generate
# and commits what it writes in the same pull request. CI regenerates the
# files, compares them whole and fails the verdict when they differ.
#
# Jobs are not written into this file: the decide job works them out when the
# workflow runs, and every fact about the change reaches the tool as an
# environment variable, never spliced into a command.
#
# Every row is `<name> / <owner>:<job>`. git-cicd's own rows are
# `Decide / git-cicd:decide` and `Report / git-cicd:report`; a config job's
# row takes its display name and job name from the decide job's outputs
# (data, evaluated into the row name, never into a command) and the
# repository's name from the event. No version is in a row name, so what
# waits on a check does not change on an upgrade; the report names each step
# with its owner and version.
#
# The `Verdict / git-cicd:verdict` a reader waits on is a COMMIT STATUS on the
# pull request's head commit, not a job: a job's check run appears only when
# the job is queued, and the job that reports is queued last. The first step
# of the first job sets the status to pending; the last step of the report job
# sets it to success or failure, and to failure when the report did not run to
# the end. Until that first step runs, the `Decide / git-cicd:decide` check is
# queued, so the commit never shows only green checks while the verdict is to
# come. A run that is cancelled or dies leaves the status pending or failed,
# never green. This is why the two status-writing jobs get `statuses: write`
# (the one write permission on `open`); the job that runs the config's
# scripts gets none and inherits the read-only top level.
#
# Overlap rule for `open`: a newer push supersedes an older run. There is no
# workflow-level `concurrency`: a run waiting on one would have no job, so no
# check and no status, until the run it supersedes had finished cancelling.
# The group is on the `run` job alone (one per pull request and job), so a
# newer push cancels the older run's script-running jobs while its own
# `decide` posts pending at once. `decide` fails when the pull request's head
# has moved on, so a superseded run queues no `run` job that could cancel the
# newer run's, and its report is FAILED for every job it needed.

name: Open

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  decide:
    name: Decide / git-cicd:decide
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    outputs:
      jobs: ${{ steps.decide.outputs.jobs }}
      names: ${{ steps.decide.outputs.names }}
      any: ${{ steps.decide.outputs.any }}
      max_parallel: ${{ steps.decide.outputs.max_parallel }}
    steps:
      - name: Set the Verdict / git-cicd:verdict status to pending
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state=pending -f context="Verdict / git-cicd:verdict" \
            -f description="waiting for the verdict" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --silent

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Decide which jobs the change needs
        id: decide
        env:
          TARGET: ${{ github.base_ref }}
          SOURCE: ${{ github.head_ref }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/git-cicd"
          python3 __TOOL__ decide --trigger=open --target="$TARGET" \
            --source="$SOURCE" --base="$BASE" --head="$HEAD_SHA" \
            --json > "$RUNNER_TEMP/git-cicd/decisions.json"
          cat "$RUNNER_TEMP/git-cicd/decisions.json"

      - name: Stop if a newer push superseded this run
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          LATEST="$(git ls-remote origin "refs/pull/$PR_NUMBER/head" | cut -f1)"
          if [ -n "$LATEST" ] && [ "$LATEST" != "$HEAD_SHA" ]; then
            echo "::error::superseded: the pull request's head is now $LATEST"
            exit 1
          fi

      - name: Upload decisions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: git-cicd-decisions
          path: ${{ runner.temp }}/git-cicd/decisions.json
          if-no-files-found: ignore

  run:
    name: ${{ fromJSON(needs.decide.outputs.names)[matrix.job] }} / ${{ github.event.repository.name }}:${{ matrix.job }}
    needs: decide
    if: needs.decide.outputs.any == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: git-cicd-open-${{ github.event.pull_request.number }}-${{ matrix.job }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.decide.outputs.max_parallel) }}
      matrix:
        job: ${{ fromJSON(needs.decide.outputs.jobs) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Run job
        env:
          JOB: ${{ matrix.job }}
          TARGET: ${{ github.base_ref }}
          SOURCE: ${{ github.head_ref }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          VENDOR_PAT: ${{ secrets.VENDOR_PAT }}
        run: |
          mkdir -p "$RUNNER_TEMP/git-cicd"
          python3 __TOOL__ run-job "$JOB" --trigger=open --target="$TARGET" \
            --source="$SOURCE" --base="$BASE" --head="$HEAD_SHA" \
            --setup --result="$RUNNER_TEMP/git-cicd/result.json"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: git-cicd-result-${{ matrix.job }}
          path: ${{ runner.temp }}/git-cicd/result.json
          if-no-files-found: ignore

  verdict:
    name: Report / git-cicd:report
    needs: [decide, run]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Download decisions and results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/git-cicd/artifacts

      - name: Verify the workflows match the config
        continue-on-error: true
        run: python3 __TOOL__ verify

      - name: Report
        run: |
          DIR="$RUNNER_TEMP/git-cicd/artifacts"
          mkdir -p "$DIR"
          python3 __TOOL__ report --trigger=open \
            --decisions="$DIR/git-cicd-decisions/decisions.json" \
            --results="$DIR" --verdict-out="$RUNNER_TEMP/git-cicd/verdict.txt"

      - name: Set the Verdict / git-cicd:verdict status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          VERDICT="$RUNNER_TEMP/git-cicd/verdict.txt"
          STATE=failure
          DESCRIPTION="FAILED - the report did not run to the end (see the Report / git-cicd:report job)"
          if [ -s "$VERDICT" ]; then
            STATE="$(sed -n 1p "$VERDICT")"
            DESCRIPTION="$(sed -n 2p "$VERDICT")"
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state="$STATE" -f context="Verdict / git-cicd:verdict" \
            -f description="$DESCRIPTION" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --silent
