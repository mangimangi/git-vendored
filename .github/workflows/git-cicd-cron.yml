# .github/workflows/git-cicd-cron.yml - GENERATED by git-cicd; do not edit by hand.
#
# The workflow for the `cron` trigger (a schedule fires), named `Cron`, so
# GitHub shows every row as `Cron / <row>`. git-cicd generates one workflow
# per trigger, each its own file with its own GitHub event, permissions and
# overlap rule:
#
#   open    Open    .github/workflows/git-cicd-open.yml    (generated)
#   merge   Merge   .github/workflows/git-cicd-merge.yml   (generated)
#   cron    Cron    .github/workflows/git-cicd-cron.yml    (generated when a job has cron in on)
#   manual  Manual  .github/workflows/git-cicd-manual.yml  (generated)
#
# Every generated file is fixed text except this file's schedule block: one
# entry per distinct cron expression among the config's jobs with cron in
# on, the only part of any generated file that varies with the config. With
# no such job this file is not generated (GitHub needs an event under on:,
# and a schedule must never fire with nothing to run); generate removes it
# and verify fails while it is there. Whoever upgrades git-cicd, or changes
# the config, runs
#   .vendored/pkg/git-cicd/git-cicd generate
# and commits what it writes in the same pull request. CI regenerates the
# files, compares them whole and fails the verdict when they differ.
#
# GitHub runs schedules only from the default branch's copy of this file, on
# the default branch's ref. decide reads the config there, takes the
# expression that fired (github.event.schedule, through env:) and needs every
# job whose cron is that expression, once for each of its literal branches;
# paths do not apply. It resolves each branch's head once, from
# origin/<branch> after a full checkout, so every job on a branch runs on the
# same commit; a branch that does not exist fails the run with that reason.
#
# Permissions: `contents: read` at the top level. The job that runs the
# config's scripts gets `contents: write` and `pull-requests: write`, and
# checks out its branch's head with full history and tags. Decide and report
# get `statuses: write` for the Verdict statuses and `pull-requests: read` to
# see whether an open pull request owns one.
#
# Overlap rule for `cron`: no queue. A schedule event carries the default
# branch's ref, not the job's branch, so cron runs do not join the queue of
# Merge and Manual runs; there is no `concurrency` key either.
#
# Every row is `<name> / <owner>:<job>`: `Decide / git-cicd:decide`, one
# `<name> / <repo>:<job>` per job and branch (from the decide job's outputs,
# data evaluated into the row name, never into a command) and
# `Report / git-cicd:report`, whose report has one section per branch. Every
# fact reaches the tool as an environment variable, never spliced into a
# command.
#
# The verdict: one `Verdict / git-cicd:verdict` COMMIT STATUS on the head
# commit of each branch the run is for. It is set to pending as soon as
# decide has resolved the heads (the first moment the commits are known), and
# to the branch's verdict by the last step of report, or to failure when the
# report did not run to the end - unless an open pull request has that commit
# as its head; then the pull request's Open run owns the status and this
# run's verdict is its `Report / git-cicd:report` check.

name: Cron

on:
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: read

jobs:
  decide:
    name: Decide / git-cicd:decide
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
      pull-requests: read
    outputs:
      runs: ${{ steps.decide.outputs.runs }}
      names: ${{ steps.decide.outputs.names }}
      any: ${{ steps.decide.outputs.any }}
      max_parallel: ${{ steps.decide.outputs.max_parallel }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide which jobs the schedule needs
        id: decide
        env:
          CRON: ${{ github.event.schedule }}
        run: |
          mkdir -p "$RUNNER_TEMP/git-cicd"
          python3 .vendored/pkg/git-cicd/git-cicd decide --trigger=cron --cron="$CRON" \
            --json > "$RUNNER_TEMP/git-cicd/decisions.json"
          cat "$RUNNER_TEMP/git-cicd/decisions.json"

      - name: Set the Verdict / git-cicd:verdict status to pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -r '.heads[] | select(. != null)' "$RUNNER_TEMP/git-cicd/decisions.json" | sort -u |
          while read -r HEAD_SHA; do
            export HEAD_SHA
            OPEN_PRS="$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls" \
              --jq '[.[] | select(.state == "open" and .head.sha == env.HEAD_SHA)] | length' < /dev/null)"
            if [ "$OPEN_PRS" != "0" ]; then
              echo "an open pull request has $HEAD_SHA as its head: its Open run sets the Verdict / git-cicd:verdict status"
              continue
            fi
            gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
              -f state=pending -f context="Verdict / git-cicd:verdict" \
              -f description="waiting for the verdict" \
              -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              --silent < /dev/null
          done

      - name: Upload decisions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: git-cicd-decisions
          path: ${{ runner.temp }}/git-cicd/decisions.json
          if-no-files-found: ignore

  run:
    name: ${{ fromJSON(needs.decide.outputs.names)[matrix.entry.job] }} / ${{ github.event.repository.name }}:${{ matrix.entry.job }}
    needs: decide
    if: needs.decide.outputs.any == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.decide.outputs.max_parallel) }}
      matrix:
        entry: ${{ fromJSON(needs.decide.outputs.runs) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ matrix.entry.sha }}

      - name: Run job
        env:
          JOB: ${{ matrix.entry.job }}
          BRANCH: ${{ matrix.entry.branch }}
          HEAD_SHA: ${{ matrix.entry.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          VENDOR_PAT: ${{ secrets.VENDOR_PAT }}
        run: |
          mkdir -p "$RUNNER_TEMP/git-cicd"
          python3 .vendored/pkg/git-cicd/git-cicd run-job "$JOB" --trigger=cron --target="$BRANCH" \
            --source="$BRANCH" --base="$HEAD_SHA" --head="$HEAD_SHA" \
            --setup --result="$RUNNER_TEMP/git-cicd/result.json"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: git-cicd-result-${{ matrix.entry.key }}
          path: ${{ runner.temp }}/git-cicd/result.json
          if-no-files-found: ignore

  verdict:
    name: Report / git-cicd:report
    needs: [decide, run]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download decisions and results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/git-cicd/artifacts

      - name: Verify the workflows match the config
        continue-on-error: true
        run: python3 .vendored/pkg/git-cicd/git-cicd verify

      - name: Report
        run: |
          DIR="$RUNNER_TEMP/git-cicd/artifacts"
          mkdir -p "$DIR"
          python3 .vendored/pkg/git-cicd/git-cicd report --trigger=cron \
            --decisions="$DIR/git-cicd-decisions/decisions.json" \
            --results="$DIR" --verdict-out="$RUNNER_TEMP/git-cicd/verdict.txt"

      - name: Set the Verdict / git-cicd:verdict status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERDICT="$RUNNER_TEMP/git-cicd/verdict.txt"
          DECISIONS="$RUNNER_TEMP/git-cicd/artifacts/git-cicd-decisions/decisions.json"
          if [ ! -f "$VERDICT" ] && [ -s "$DECISIONS" ]; then
            jq -r '.heads[] | select(. != null) | . + "\tfailure\tFAILED - the report did not run to the end (see the Report / git-cicd:report job)"' \
              "$DECISIONS" | sort -u > "$VERDICT"
          fi
          touch "$VERDICT"
          while IFS="$(printf '\t')" read -r HEAD_SHA STATE DESCRIPTION; do
            export HEAD_SHA
            OPEN_PRS="$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls" \
              --jq '[.[] | select(.state == "open" and .head.sha == env.HEAD_SHA)] | length' < /dev/null)"
            if [ "$OPEN_PRS" != "0" ]; then
              echo "an open pull request has $HEAD_SHA as its head: its Open run sets the Verdict / git-cicd:verdict status; this run's verdict is the Report / git-cicd:report check"
              continue
            fi
            gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
              -f state="$STATE" -f context="Verdict / git-cicd:verdict" \
              -f description="$DESCRIPTION" \
              -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              --silent < /dev/null
          done < "$VERDICT"
