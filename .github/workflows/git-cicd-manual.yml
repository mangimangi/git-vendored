# .github/workflows/git-cicd-manual.yml - GENERATED by git-cicd; do not edit by hand.
#
# The workflow for manual runs (one named job, run by hand from the Actions
# tab), named `Manual`, so GitHub shows every row as `Manual / <row>`.
# git-cicd generates one workflow per trigger, each its own file with its own
# GitHub event, permissions and overlap rule:
#
#   open    Open    .github/workflows/git-cicd-open.yml    (generated)
#   merge   Merge   .github/workflows/git-cicd-merge.yml   (generated)
#   cron    Cron    .github/workflows/git-cicd-cron.yml    (generated when a job has cron in on)
#   manual  Manual  .github/workflows/git-cicd-manual.yml  (generated)
#
# Every generated file is fixed text except the cron workflow's schedule
# block, this workflow's form (the `inputs:` of its `workflow_dispatch`) and,
# in every workflow, the run job of each permission group (below) with the
# decide output and the report's `needs` that go with it, which git-cicd
# writes from the config; the rest of this file varies only
# with the git-cicd version (and the tool path, which is where git-cicd is
# installed). Whoever upgrades git-cicd, or changes the config (a job's
# inputs, a job added or removed, its `manual` flag), runs
#   .vendored/pkg/git-cicd/git-cicd generate
# and commits what it writes in the same pull request. CI regenerates the
# files, compares them whole and fails the verdict when they differ. When no
# job allows manual runs this file is not generated (generate removes it).
#
# Event: `workflow_dispatch` with a form generated from the config: `job`, a
# dropdown of the jobs that allow manual runs, in config order, run on the
# branch the run is started on; then one named field per distinct declared
# input of those jobs (its description, default and, for choices, a
# dropdown), shared by jobs declaring the same name. Names in the form are
# validated identifiers; descriptions, defaults and options are JSON strings,
# and `${{` in them is refused by validate. The input fields are optional in
# the form, since it shows every job's fields; the tool enforces `required`
# for the chosen job (an empty value is missing). The whole form reaches the
# tool as one environment variable, CICD_MANUAL_FORM (`toJSON(inputs)`, in a
# fixed env line, never in a `run:` block), which the tool reads and removes
# from the scripts' environment; the chosen job gets each input it declares
# as CICD_INPUT_<NAME>. Fields it does not declare are ignored, and the
# report names each one whose value is not its form default. The job runs
# when it exists, does not say `"manual": false` and its `branches` match
# the branch; `paths` is ignored. Anything else is refused, as are form
# values that are not a JSON object of strings, a missing required input or
# a value outside its choices: decide records the reason, needs no job, and
# the report is FAILED with that reason.
#
# Permissions: `contents: read` at the top level. The job that runs the
# config's scripts gets `contents: write` and `pull-requests: write` (a
# release pushes a commit and tags, or opens a pull request), and checks out
# the run's commit on its branch with full history and tags. Decide and
# report get `statuses: write` for the Verdict status, `pull-requests: read`
# to see whether an open pull request owns it, and decide `actions: read` for
# the queue.
#
# A config job that declares `permissions` beyond this default runs instead
# in a run job of its own, one per distinct effective permission set, with
# the id `run-` plus each scope and level beyond the default (for example
# `run-packages-write`): generate writes it as a copy of `run` whose
# permissions are the default plus the declaration (the higher level wins,
# written literally: GitHub takes no expression in a job's `permissions`,
# and they apply to every matrix entry) and whose matrix is that group's
# entry of decide's `groups` output; `run` keeps every other job. A group
# job with nothing to run runs its placeholder entry
# `(nothing:<id>)`, row `Nothing needed / <repo>:(nothing:<id>)`, with its
# steps skipped, for the reason `run` does (below).
#
# Secrets: a job gets only the secrets its config job declares (`secrets`,
# from the documented set CICD_WRITE_TOKEN, CICD_READ_TOKEN and the
# deprecated VENDOR_PAT). The step that runs a job has one fixed env line per
# documented name, which gives the secret only to a matrix entry whose job
# declares it (decide's `secrets` output, job -> declared names) and the empty
# string otherwise; the tool removes every undeclared or empty one, so a
# script sees a secret only when its job declares it and it is set. No config
# value is written into this file. GITHUB_TOKEN reaches every job.
#
# Overlap rule: manual runs share the queue of `merge`. Runs on one branch go
# one at a time and are never cancelled. There is no `concurrency` key: a
# GitHub concurrency group keeps only one pending run and cancels the one
# before it when a newer run joins, even with cancel-in-progress off. Instead
# decide, after posting pending, waits until no earlier run (lower run id) of
# git-cicd-merge.yml or git-cicd-manual.yml on the same branch is queued or
# in progress.
#
# Every row is `<name> / <owner>:<job>`: `Decide / git-cicd:decide`, the
# `<name> / <repo>:<job>` of the job (from the decide job's outputs, data
# evaluated into the row name, never into a command) and
# `Report / git-cicd:report`. Every fact reaches the tool as an environment
# variable, never spliced into a command.
#
# A run that needs no job still runs the `run` job, once, as the placeholder
# entry `(nothing)`, whose row is `Nothing needed / <repo>:(nothing)` and
# whose steps are all skipped. The job has no job-level `if`: GitHub does not
# expand a matrix job's name when the job is skipped before its matrix is
# evaluated, so a skipped `run` job would show its `name:` expression as raw
# text.
#
# The verdict: the `Verdict / git-cicd:verdict` COMMIT STATUS on the run's
# commit, pending from the first step of decide and final from the last step
# of report, and failure when the report did not run to the end - unless an
# open pull request has that commit as its head. Then the pull request's Open
# run owns the status, and this run's verdict is its
# `Report / git-cicd:report` check, which fails on a FAILED verdict, and its
# job summary.

name: Manual

on:
  workflow_dispatch:
    inputs:
      job:
        description: "The config job to run"
        required: true
        type: choice
        options:
          - "release"
          - "update-vendored"
          - "validate"
      vendor:
        description: "Vendor to update, or all (job update-vendored)"
        required: false
        default: "all"
        type: string
      version:
        description: "Version to install (default: latest) (jobs update-vendored, validate)"
        required: false
        default: "latest"
        type: string
      private:
        description: "Vendor repo is private (only needed when adding a new vendor) (job update-vendored)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      repo:
        description: "GitHub repo to validate (owner/repo) (job validate)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  decide:
    name: Decide / git-cicd:decide
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
      actions: read
      pull-requests: read
    outputs:
      jobs: ${{ steps.decide.outputs.jobs }}
      names: ${{ steps.decide.outputs.names }}
      secrets: ${{ steps.decide.outputs.secrets }}
      any: ${{ steps.decide.outputs.any }}
      max_parallel: ${{ steps.decide.outputs.max_parallel }}
    steps:
      - name: Set the Verdict / git-cicd:verdict status to pending
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          OPEN_PRS="$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls" \
            --jq '[.[] | select(.state == "open" and .head.sha == env.HEAD_SHA)] | length')"
          if [ "$OPEN_PRS" != "0" ]; then
            echo "an open pull request has $HEAD_SHA as its head: its Open run sets the Verdict / git-cicd:verdict status"
            exit 0
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state=pending -f context="Verdict / git-cicd:verdict" \
            -f description="waiting for the verdict" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --silent

      - name: Wait for earlier Merge and Manual runs on this branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          while :; do
            EARLIER="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs" \
              -f branch="$BRANCH" -F per_page=100 \
              --jq '.workflow_runs[] | select(.status != "completed") | select(.path == ".github/workflows/git-cicd-merge.yml" or .path == ".github/workflows/git-cicd-manual.yml") | select(.id < (env.GITHUB_RUN_ID | tonumber)) | .id')"
            if [ -z "$EARLIER" ]; then
              break
            fi
            echo "waiting for earlier runs on this branch to finish:" $EARLIER
            sleep 20
          done

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Decide whether the job may run
        id: decide
        env:
          JOB: ${{ inputs.job }}
          CICD_MANUAL_FORM: ${{ toJSON(inputs) }}
          BRANCH: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/git-cicd"
          python3 .vendored/pkg/git-cicd/git-cicd decide --trigger=manual --job="$JOB" \
            --target="$BRANCH" --source="$BRANCH" --base="$HEAD_SHA" \
            --head="$HEAD_SHA" --json > "$RUNNER_TEMP/git-cicd/decisions.json"
          cat "$RUNNER_TEMP/git-cicd/decisions.json"

      - name: Upload decisions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: git-cicd-decisions
          path: ${{ runner.temp }}/git-cicd/decisions.json
          if-no-files-found: ignore

  run:
    name: ${{ fromJSON(needs.decide.outputs.names)[matrix.job] }} / ${{ github.event.repository.name }}:${{ matrix.job }}
    needs: decide
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.decide.outputs.max_parallel) }}
      matrix:
        job: ${{ fromJSON(needs.decide.outputs.jobs) }}
    steps:
      - name: Checkout repository
        if: matrix.job != '(nothing)'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Run job
        if: matrix.job != '(nothing)'
        env:
          JOB: ${{ matrix.job }}
          CICD_MANUAL_FORM: ${{ toJSON(inputs) }}
          BRANCH: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          CICD_WRITE_TOKEN: ${{ contains(fromJSON(needs.decide.outputs.secrets)[matrix.job], 'CICD_WRITE_TOKEN') && secrets.CICD_WRITE_TOKEN || '' }}
          CICD_READ_TOKEN: ${{ contains(fromJSON(needs.decide.outputs.secrets)[matrix.job], 'CICD_READ_TOKEN') && secrets.CICD_READ_TOKEN || '' }}
          VENDOR_PAT: ${{ contains(fromJSON(needs.decide.outputs.secrets)[matrix.job], 'VENDOR_PAT') && secrets.VENDOR_PAT || '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/git-cicd"
          python3 .vendored/pkg/git-cicd/git-cicd run-job "$JOB" --trigger=manual --target="$BRANCH" \
            --source="$BRANCH" --base="$HEAD_SHA" --head="$HEAD_SHA" \
            --setup --result="$RUNNER_TEMP/git-cicd/result.json"

      - name: Upload result
        if: always() && matrix.job != '(nothing)'
        uses: actions/upload-artifact@v4
        with:
          name: git-cicd-result-${{ matrix.job }}
          path: ${{ runner.temp }}/git-cicd/result.json
          if-no-files-found: ignore

  verdict:
    name: Report / git-cicd:report
    needs: [decide, run]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download decisions and results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/git-cicd/artifacts

      - name: Verify the workflows match the config
        continue-on-error: true
        run: python3 .vendored/pkg/git-cicd/git-cicd verify

      - name: Report
        run: |
          DIR="$RUNNER_TEMP/git-cicd/artifacts"
          mkdir -p "$DIR"
          python3 .vendored/pkg/git-cicd/git-cicd report --trigger=manual \
            --decisions="$DIR/git-cicd-decisions/decisions.json" \
            --results="$DIR" --verdict-out="$RUNNER_TEMP/git-cicd/verdict.txt"

      - name: Set the Verdict / git-cicd:verdict status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          OPEN_PRS="$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls" \
            --jq '[.[] | select(.state == "open" and .head.sha == env.HEAD_SHA)] | length')"
          if [ "$OPEN_PRS" != "0" ]; then
            echo "an open pull request has $HEAD_SHA as its head: its Open run sets the Verdict / git-cicd:verdict status; this run's verdict is the Report / git-cicd:report check"
            exit 0
          fi
          VERDICT="$RUNNER_TEMP/git-cicd/verdict.txt"
          STATE=failure
          DESCRIPTION="FAILED - the report did not run to the end (see the Report / git-cicd:report job)"
          if [ -s "$VERDICT" ]; then
            STATE="$(sed -n 1p "$VERDICT")"
            DESCRIPTION="$(sed -n 2p "$VERDICT")"
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state="$STATE" -f context="Verdict / git-cicd:verdict" \
            -f description="$DESCRIPTION" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --silent
