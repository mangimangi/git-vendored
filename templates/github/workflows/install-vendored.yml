# .github/workflows/install-vendored.yml
# Installs or updates vendored tools via .vendored/config.json.
#
# Handles all vendors from a single workflow — no per-vendor workflow files.
# All logic lives in .vendored/install; this workflow just provides triggers.
#
# Triggers:
#   - schedule: weekly check for all vendors
#   - workflow_dispatch: manual update of one or all vendors
#   - workflow_call: for callers like dogfood.yml
#
# Auth:
#   - GITHUB_TOKEN for public vendor repos
#   - CICD_WRITE_TOKEN secret: pushes the install branch (with workflow
#     files), opens the PR and requests auto-merge, so the PR's checks run.
#     Required under CI: without it --pr fails before changing anything.
#   - CICD_READ_TOKEN secret for private vendor repos (vendor.private: true);
#     CICD_WRITE_TOKEN is used when it is not set
#   - VENDOR_PAT secret: deprecated old name, still read

name: Install Vendored

on:
  schedule:
    - cron: '0 9 * * 1'  # Mondays at 9am UTC
  workflow_dispatch:
    inputs:
      vendor:
        description: 'Vendor to update (or "all")'
        required: false
        default: 'all'
      version:
        description: 'Version to install (default: latest)'
        required: false
        default: 'latest'
      private:
        description: 'Vendor repo is private (only needed when adding a new vendor)'
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      vendor:
        type: string
        required: true
      version:
        type: string
        default: 'latest'
      private:
        type: boolean
        default: false
    secrets:
      token:
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run vendored install
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CICD_WRITE_TOKEN: ${{ secrets.token || secrets.CICD_WRITE_TOKEN || '' }}
          CICD_READ_TOKEN: ${{ secrets.CICD_READ_TOKEN || '' }}
          VENDOR_PAT: ${{ secrets.VENDOR_PAT || '' }}
          GH_TOKEN: ${{ secrets.token || secrets.CICD_WRITE_TOKEN || secrets.VENDOR_PAT || github.token }}
        run: |
          VENDOR="${{ inputs.vendor || 'all' }}"
          VERSION="${{ inputs.version || 'latest' }}"
          PRIVATE_FLAG=""
          if [ "${{ inputs.private }}" = "true" ]; then
            PRIVATE_FLAG="--private"
          fi
          python3 .vendored/install "$VENDOR" --version "$VERSION" --pr --deps=install $PRIVATE_FLAG
